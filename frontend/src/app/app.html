<!-- header is shown on every page -->
<header>
  <h1>Sprout</h1>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Start</a>
    <a routerLink="/plants" routerLinkActive="active">Pflanzen</a>
    <a routerLink="/beds" routerLinkActive="active">Beete</a>

    @if (username()) {
      <span>Angemeldet als {{ username() }}</span>
      <button (click)="logout()">Abmelden</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Anmelden</a>
      <a routerLink="/register" routerLinkActive="active">Registrieren</a>
    }
  </nav>
</header>

<!-- the component of the current route is shown here -->
<main>
  <router-outlet />
</main>
