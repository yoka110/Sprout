<h2>Anmelden</h2>

<!-- [formGroup] connects this form to the loginForm object in the class -->
<!-- (ngSubmit) calls onSubmit() and stops the page from reloading -->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <!-- for and id belong together: clicking the label focuses the field -->
  <label for="username">Benutzername</label>
  <!-- formControlName links this input to the control of the same name -->
  <input id="username" type="text" formControlName="username">

  <label for="password">Passwort</label>
  <!-- type password shows dots instead of the typed text -->
  <input id="password" type="password" formControlName="password">

  <!-- only shown while errorMessage is not empty -->
  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <button type="submit" class="btn">Anmelden</button>
</form>

<!-- routerLink switches the page without reloading the whole app -->
<p>Noch kein Konto? <a routerLink="/register">Registrieren</a></p>
